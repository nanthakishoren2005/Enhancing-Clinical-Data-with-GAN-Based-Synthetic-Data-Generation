# ==============================================================================
# Configuration for Conditional WGAN-GP (Wasserstein GAN with Gradient Penalty)
# NEW config file - configs/config.yaml is intentionally left untouched.
# ==============================================================================

project:
  title: "Conditional WGAN-GP for COVID-19 Chest X-ray Synthetic Augmentation"
  version: "2.0.0-wgan-gp"
  random_seed: 42

dataset:
  classes:
    - "normal"
    - "covid"
    - "lung_opacity"
    - "viral_pneumonia"
  num_classes: 4
  image_size: 128
  channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  original_dir: "data/original"
  synthetic_dir: "data/synthetic"

gan:
  latent_dim: 100
  embedding_dim: 32
  gen_feature_maps: 64
  disc_feature_maps: 64
  # WGAN-GP standard settings (Adam with beta1=0.0)
  lr_g: 0.0001
  lr_d: 0.0001
  beta1: 0.0
  beta2: 0.9
  batch_size: 32
  epochs: 50
  n_critic: 5            # Critic updates per generator update
  lambda_gp: 10.0        # Gradient penalty coefficient
  save_sample_interval: 2
  num_synthetic_per_class: 100

cnn:
  architecture: "resnet18"
  pretrained: true
  freeze_backbone: false
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 15
  early_stopping_patience: 5

paths:
  checkpoints_dir: "checkpoints"
  figures_dir: "outputs/figures"
  reports_dir: "outputs/reports"
  samples_dir: "outputs/gan_samples"

hardware:
  device: "auto"
  num_workers: 0
